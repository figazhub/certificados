name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-rules.yml"

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Firebase service account secret
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not configured in this repository."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.33.0 --no-audit --no-fund

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project cert-generator-3b9bb --non-interactive

