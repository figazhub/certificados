name: Clean Test Certificate Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clean-test-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin@latest
      - name: Delete test history only
        run: |
          node <<'NODE'
          const { initializeApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');

          initializeApp({ projectId: 'cert-generator-3b9bb' });
          const db = getFirestore();

          const certificateIds = [
            '4Zvg3TqMVlT4PPzJxBLN',
            '5AyyiMRvVCv2sHifhORi',
            'Q0P1xmTVxHjwiDWou9hz',
            'ahAWZXzDeVSdEUwDeGAc',
            'iwzvO2ipjFPb3t19kG1R'
          ];

          const publicIds = [
            'EXT-2026-0451CFCE40AC2AA92B',
            'EXT-2026-1F65E4543AFCF071A1',
            'EXT-2026-8F29F11334AB9E5CA1'
          ];

          (async () => {
            const batch = db.batch();

            for (const id of publicIds) {
              batch.delete(db.collection('publicCertificates').doc(id));
            }

            for (const id of certificateIds) {
              batch.delete(db.collection('certificates').doc(id));
            }

            await batch.commit();

            const certs = await db.collection('certificates').get();
            const publics = await db.collection('publicCertificates').get();
            const locks = await db.collection('rejectedStudentLocks').get();

            console.log('CLEANUP_OK');
            console.log('CERTIFICATES_REMAINING=' + certs.size);
            console.log('PUBLIC_CERTIFICATES_REMAINING=' + publics.size);
            console.log('REJECTED_LOCKS_REMAINING=' + locks.size);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
