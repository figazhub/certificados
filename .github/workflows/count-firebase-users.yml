name: Count Firebase Access Users

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/count-firebase-users.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin@latest
      - name: Count ready logins
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');
          admin.initializeApp({ projectId: 'cert-generator-3b9bb' });

          (async () => {
            let authUsers = [];
            let pageToken;
            do {
              const page = await admin.auth().listUsers(1000, pageToken);
              authUsers.push(...page.users);
              pageToken = page.pageToken;
            } while (pageToken);

            const profilesSnap = await admin.firestore().collection('usersByEmail').get();
            const profiles = profilesSnap.docs.map(d => ({ id: d.id.toLowerCase(), data: d.data() }));
            const authEmails = new Set(authUsers.map(u => String(u.email || '').toLowerCase()).filter(Boolean));
            const ready = profiles.filter(p => authEmails.has(p.id));
            const authorizedOnly = profiles.filter(p => !authEmails.has(p.id));
            const authOnly = authUsers.filter(u => u.email && !profiles.some(p => p.id === String(u.email).toLowerCase()));

            console.log('AUTH_USERS=' + authUsers.length);
            console.log('AUTHORIZED_PROFILES=' + profiles.length);
            console.log('READY_LOGINS=' + ready.length);
            console.log('AUTHORIZED_WITHOUT_AUTH=' + authorizedOnly.length);
            console.log('AUTH_WITHOUT_PROFILE=' + authOnly.length);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
